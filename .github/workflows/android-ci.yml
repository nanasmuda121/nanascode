name: Android CI & Build APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Test NanasCode
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Prepare Gradle Wrapper
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Generating Gradle wrapper..."
            gradle wrapper --gradle-version 8.7
          fi
          chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testStandaloneDebugUnitTest --continue

      - name: Build Release & Debug APKs
        run: ./gradlew assembleStandaloneRelease assembleStandaloneDebug --stacktrace

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NanasCode-standalone-release-apk
          path: app/build/outputs/apk/standalone/release/app-standalone-release.apk
          retention-days: 30

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NanasCode-standalone-debug-apk
          path: app/build/outputs/apk/standalone/debug/app-standalone-debug.apk
          retention-days: 30

      - name: Upload Unit Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: "**/build/reports/tests/**"
          retention-days: 7

      - name: Create or Update GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.0-alpha
          name: "NanasCode v0.2.0-alpha (Milestone 2 - CodeMirror 6 Editor & Multi-Tab)"
          body: |
            ### 🍍 NanasCode v0.2.0-alpha (Milestone 2: Code Editor & Multi-Tab)
            Rilis resmi Milestone 2 dengan CodeMirror 6 Mobile Editor, Penjelajah File, Sistem Logout, dan Perbaikan Pembacaan Repositori!

            #### ✨ Apa yang Baru di v0.2.0-alpha:
            1. **Sistem Log Out Lengkap**:
               - Menu akun profil di pojok kanan atas Workspace dan Repositori.
               - Opsi keluar dari akun GitHub dengan dialog konfirmasi keamanan.
               - Membersihkan token terenkripsi dari Keystore dan DataStore serta kembali ke mode lokal/tamu secara mulus.
            2. **Perbaikan Pembacaan Repositori GitHub**:
               - Memperbaiki deserialisasi JSON terhadap nilai `null` pada `default_branch` dan properti kosong repositori baru.
               - Menghapus parameter `affiliation` berkonflik pada GitHub API `/user/repos`.
               - Mengirim header `Authorization: Bearer` eksplisit sehingga repositori langsung dimuat tanpa kendala.
            3. **CodeMirror 6 Touch-Friendly Mobile Editor**:
               - Editor berbasis webview asset lokal berkecepatan tinggi dengan nomor baris dan tema gelap Acode (`#1E1E1E`).
               - Toolbar simbol aksesori di atas keyboard virtual (`Tab`, `{}`, `[]`, `()`, `<`, `>`, `=`, `;`, `"`, `'`, `/`, `\`, `!`, `?`, `Undo`, `Redo`).
               - Indikator baris dan kolom kursor (`Ln X, Col Y`).
            4. **Multi-Tab File Manager**:
               - Membuka banyak file sekaligus dalam deretan tab horizontal.
               - Indikator titik kuning (`#F5C518`) untuk file yang belum tersimpan (*dirty flag*).
               - Dialog konfirmasi perlindungan data saat menutup file yang memiliki perubahan belum disimpan.
            5. **Penjelajah File Hirarkis (File Explorer Drawer)**:
               - Drawer penjelajah file untuk menjelajahi seluruh folder workspace.
               - Fitur buat file baru, buat folder baru, dan hapus file dengan ikon ekstensi lengkap.
            6. **Live Web Preview**:
               - Tombol Play untuk mempratinjau kode HTML, CSS, dan JavaScript secara instan di dalam aplikasi.
            7. **Foreground Service (`specialUse`)**:
               - Menjaga editor, terminal, dan server lokal tetap persisten di latar belakang sesuai standar Android 14+.

            ---
            #### 📥 Download Langsung:
            - **[app-standalone-release.apk](https://github.com/nanasmuda121/nanascode/releases/download/v0.2.0-alpha/app-standalone-release.apk)** (Disarankan, Release teroptimasi R8)
            - **[app-standalone-debug.apk](https://github.com/nanasmuda121/nanascode/releases/download/v0.2.0-alpha/app-standalone-debug.apk)** (Debug build)
          files: |
            app/build/outputs/apk/standalone/release/app-standalone-release.apk
            app/build/outputs/apk/standalone/debug/app-standalone-debug.apk
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
