name: Android CI & Build APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Test NanasCode
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Prepare Gradle Wrapper
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Generating Gradle wrapper..."
            gradle wrapper --gradle-version 8.7
          fi
          chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testStandaloneDebugUnitTest --continue

      - name: Build Release & Debug APKs
        run: ./gradlew assembleStandaloneRelease assembleStandaloneDebug --stacktrace

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NanasCode-standalone-release-apk
          path: app/build/outputs/apk/standalone/release/app-standalone-release.apk
          retention-days: 30

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NanasCode-standalone-debug-apk
          path: app/build/outputs/apk/standalone/debug/app-standalone-debug.apk
          retention-days: 30

      - name: Upload Unit Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: "**/build/reports/tests/**"
          retention-days: 7

      - name: Create or Update GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.5-alpha
          name: "NanasCode v0.1.5-alpha (Release APK)"
          body: |
            ### 🍍 NanasCode v0.1.5-alpha (Milestone 1.5 Update)
            Build APK Release terbaru dengan mode lokal offline-first dan enkripsi hardware Keystore!

            #### ✨ Apa yang Baru:
            1. **Login GitHub Sekarang Opsional**:
               - Layar awal menyediakan pilihan **"Lanjut Tanpa Login"** dan **"Masuk dengan GitHub"**.
               - Koding, manajemen file, terminal, dan git commit offline dapat digunakan sepenuhnya tanpa akun GitHub.
               - Login dapat dilakukan kapan saja nanti dari menu Pengaturan atau saat mempublikasikan proyek ke GitHub.
            2. **Workspace Lokal & Project Templates**:
               - Template bawaan: **HTML5 + Tailwind CSS v4**, **Node.js + Express API**, **React + Vite**, **Python CLI**, dan **Proyek Kosong**.
               - Dukungan impor/ekspor folder eksternal via SAF (*Storage Access Framework*).
               - Tombol **"Publikasikan ke GitHub"** untuk mengekspor proyek lokal ke repo GitHub baru.
            3. **Android Keystore (AES-256-GCM) + DataStore**:
               - Menggantikan *EncryptedSharedPreferences* dengan *Hardware-backed Keystore AES-GCM*.
               - Ciphertext tersimpan aman di Preferences DataStore secara asinkron tanpa I/O blocking.
            4. **Offline Git Engine (JGit)**:
               - Inisialisasi git lokal (`git init`), commit (`git commit`), status, dan branch secara offline.
               - Kloning repositori publik tanpa autentikasi (anonymous clone via JGit).
            5. **Package Rename**: Migrasi bersih ke `com.nanascode.app`.
            6. **Stack Update**: AGP 8.6.1, Kotlin 2.0.21, KSP 2.0.21-1.0.28, Hilt 2.52, Compose BOM 2024.10.00.

            ---
            #### 📥 Download Langsung:
            - **[app-standalone-release.apk](https://github.com/nanasmuda121/nanascode/releases/download/v0.1.5-alpha/app-standalone-release.apk)** (Disarankan, Release siap pakai)
            - **[app-standalone-debug.apk](https://github.com/nanasmuda121/nanascode/releases/download/v0.1.5-alpha/app-standalone-debug.apk)** (Debug build)
          files: |
            app/build/outputs/apk/standalone/release/app-standalone-release.apk
            app/build/outputs/apk/standalone/debug/app-standalone-debug.apk
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
