name: Android CI & Build APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Test NanasCode
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Prepare Gradle Wrapper
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Generating Gradle wrapper..."
            gradle wrapper --gradle-version 8.7
          fi
          chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --continue

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NanasCode-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload Unit Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: "**/build/reports/tests/**"
          retention-days: 7

      - name: Create or Update GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-alpha
          name: "NanasCode v0.1.0-alpha (Debug APK)"
          body: |
            ### 🍍 NanasCode v0.1.0-alpha
            Build APK terbaru dari Milestone 1 (M1).

            #### Fitur:
            - **GitHub Authentication**: Personal Access Token (Classic & Fine-grained), validasi scope (`repo`, `read:user`, `workflow`).
            - **Repository Management**: Daftar repo publik/private, filter, pencarian, dan pembuatan repo baru.
            - **GitHub Actions Tab**: Khusus repo publik untuk memantau status CI/CD.
            - **Material 3 UI**: Antarmuka responsif ramah sentuh ala Acode dengan warna khas Nanas.

            **Direct Download**: Klik file `app-debug.apk` di bawah untuk langsung download dan install di Android.
          files: app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
