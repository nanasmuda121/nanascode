<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NasCode Terminal</title>
  <link rel="stylesheet" href="xterm.css" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #121212;
      overflow: hidden;
    }
    #terminal-container {
      width: 100%;
      height: 100%;
      padding: 4px;
    }
    .xterm {
      height: 100%;
    }
  </style>
</head>
<body>
  <div id="terminal-container"></div>

  <script src="xterm.js"></script>
  <script src="addon-fit.js"></script>
  <script>
    let term;
    let fitAddon;

    function initTerminal() {
      term = new Terminal({
        theme: {
          background: '#121212',
          foreground: '#EDEDED',
          cursor: '#F59E0B',
          cursorAccent: '#121212',
          selectionBackground: '#3F3F46',
          black: '#18181B',
          red: '#EF4444',
          green: '#10B981',
          yellow: '#F59E0B',
          blue: '#3B82F6',
          magenta: '#EC4899',
          cyan: '#06B6D4',
          white: '#F4F4F5',
          brightBlack: '#71717A',
          brightRed: '#F87171',
          brightGreen: '#34D399',
          brightYellow: '#FBBF24',
          brightBlue: '#60A5FA',
          brightMagenta: '#F472B6',
          brightCyan: '#22D3EE',
          brightWhite: '#FFFFFF'
        },
        fontFamily: 'monospace, JetBrains Mono, Consolas, Courier',
        fontSize: 13,
        lineHeight: 1.2,
        cursorBlink: true,
        convertEol: true,
        scrollback: 5000
      });

      fitAddon = new FitAddon.FitAddon();
      term.loadAddon(fitAddon);

      const container = document.getElementById('terminal-container');
      term.open(container);
      fitAddon.fit();

      term.onData(data => {
        if (window.TerminalBridge && window.TerminalBridge.onInput) {
          window.TerminalBridge.onInput(data);
        }
      });

      term.onResize(size => {
        if (window.TerminalBridge && window.TerminalBridge.onResize) {
          window.TerminalBridge.onResize(size.cols, size.rows);
        }
      });

      window.addEventListener('resize', () => {
        try {
          fitAddon.fit();
          if (window.TerminalBridge && window.TerminalBridge.onResize) {
            window.TerminalBridge.onResize(term.cols, term.rows);
          }
        } catch (e) {}
      });

      if (window.TerminalBridge && window.TerminalBridge.onReady) {
        window.TerminalBridge.onReady(term.cols, term.rows);
      }
    }

    // API callable from Kotlin Android WebView
    window.writeOutput = function(text) {
      if (term) {
        term.write(text);
      }
    };

    window.clearTerminal = function() {
      if (term) {
        term.clear();
      }
    };

    window.focusTerminal = function() {
      if (term) {
        term.focus();
      }
    };

    window.fitTerminal = function() {
      if (fitAddon && term) {
        fitAddon.fit();
        if (window.TerminalBridge && window.TerminalBridge.onResize) {
          window.TerminalBridge.onResize(term.cols, term.rows);
        }
      }
    };

    window.addEventListener('DOMContentLoaded', initTerminal);
  </script>
</body>
</html>
