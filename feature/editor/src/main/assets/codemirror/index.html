<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NasCode Editor</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #121212;
      color: #D4D4D4;
      font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', Consolas, monospace;
      font-size: 14px;
      overflow: hidden;
    }
    #editor-layout {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: row;
      background: #121212;
    }
    #gutter {
      width: 44px;
      padding: 12px 6px;
      background-color: #121212;
      border-right: 1px solid #222222;
      color: #555555;
      text-align: right;
      font-size: 13px;
      line-height: 22px;
      user-select: none;
      overflow: hidden;
      white-space: pre;
    }
    #editor-viewport {
      flex: 1;
      height: 100%;
      position: relative;
      overflow: hidden;
    }
    #highlighting, #editing {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      padding: 12px 14px;
      border: 0;
      font-family: inherit;
      font-size: 14px;
      line-height: 22px;
      tab-size: 2;
      white-space: pre;
      word-wrap: normal;
      overflow: auto;
    }
    /* Syntax Highlight Layer underneath */
    #highlighting {
      z-index: 1;
      pointer-events: none;
      background: transparent;
      color: #E0E0E0;
    }
    #highlighting code {
      font-family: inherit;
      font-size: inherit;
      line-height: inherit;
    }
    /* Transparent Editing Textarea on top */
    #editing {
      z-index: 2;
      color: transparent;
      background: transparent;
      caret-color: #FFFFFF;
      outline: none;
      resize: none;
    }
    #editing::selection {
      background: #264F78;
      color: transparent;
    }

    /* Standard Colorful Code Block Syntax Theme (VS Code Dark+) */
    .token-comment  { color: #6A9955; font-style: italic; }
    .token-string   { color: #CE9178; }
    .token-keyword  { color: #569CD6; font-weight: bold; }
    .token-control  { color: #C586C0; font-weight: bold; }
    .token-number   { color: #B5CEA8; }
    .token-boolean  { color: #569CD6; }
    .token-function { color: #DCDCAA; }
    .token-type     { color: #4EC9B0; }
    .token-property { color: #9CDCFE; }
    .token-tag      { color: #569CD6; }
    .token-attr     { color: #9CDCFE; }
    .token-operator { color: #D4D4D4; }
    .token-symbol   { color: #E0E0E0; }
  </style>
</head>
<body>
  <div id="editor-layout">
    <div id="gutter">1</div>
    <div id="editor-viewport">
      <pre id="highlighting" aria-hidden="true"><code id="highlighting-content"></code></pre>
      <textarea id="editing" spellcheck="false" autocapitalize="off" autocomplete="off" placeholder="// Ketik kode Anda di sini..."></textarea>
    </div>
  </div>

  <script>
    (function() {
      const editing = document.getElementById('editing');
      const highlighting = document.getElementById('highlighting-content');
      const gutter = document.getElementById('gutter');

      let currentLanguage = 'javascript';
      let isProgrammaticChange = false;
      const historyStack = [];
      let historyIndex = -1;

      // Escape HTML
      function escapeHtml(text) {
        return text
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      // Syntax Highlighter Tokenizer (Standard Code Block Coloring)
      function highlightCode(code, lang) {
        if (!code) return '';

        // Token definitions
        const controlKeywords = /^(if|else|for|while|do|switch|case|break|continue|return|try|catch|finally|throw|yield|await|import|export|from|as)$/;
        const generalKeywords = /^(const|let|var|function|class|extends|new|this|super|type|interface|enum|implements|package|private|protected|public|static|val|fun|def|self|lambda|print|null|undefined|nil|typeof|instanceof|void|delete|in|of)$/;
        const booleans = /^(true|false)$/;

        // Match tokens: Strings, Comments, Numbers, Words, Operators
        const tokenRegex = /(\/\/[^\n]*|\/\*[\s\S]*?\*\/|#[^\n]*)|("(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*'|`(?:\\.|[^`\\])*`)|(\b\d+(?:\.\d+)?\b)|(\b[a-zA-Z_$][a-zA-Z0-9_$]*\b)|(&lt;\/?[a-zA-Z0-9\-]+|&gt;)|(\s+|[^\s\w])/g;

        let escaped = escapeHtml(code);
        let result = '';
        let lastIndex = 0;
        let match;

        while ((match = tokenRegex.exec(escaped)) !== null) {
          const [full, comment, string, number, word, tag, other] = match;

          if (comment) {
            result += `<span class="token-comment">${comment}</span>`;
          } else if (string) {
            result += `<span class="token-string">${string}</span>`;
          } else if (number) {
            result += `<span class="token-number">${number}</span>`;
          } else if (word) {
            if (controlKeywords.test(word)) {
              result += `<span class="token-control">${word}</span>`;
            } else if (generalKeywords.test(word)) {
              result += `<span class="token-keyword">${word}</span>`;
            } else if (booleans.test(word)) {
              result += `<span class="token-boolean">${word}</span>`;
            } else if (escaped.substr(tokenRegex.lastIndex, 10).trim().startsWith('(')) {
              result += `<span class="token-function">${word}</span>`;
            } else if (/^[A-Z][a-zA-Z0-9_$]*$/.test(word)) {
              result += `<span class="token-type">${word}</span>`;
            } else {
              result += `<span class="token-property">${word}</span>`;
            }
          } else if (tag) {
            result += `<span class="token-tag">${tag}</span>`;
          } else {
            result += other;
          }
        }

        // Add trailing newline if ends with \n so pre doesn't collapse
        if (code.endsWith('\n')) {
          result += ' ';
        }

        return result;
      }

      function updateEditor() {
        const text = editing.value;
        highlighting.innerHTML = highlightCode(text, currentLanguage);

        // Update gutter line numbers
        const lines = text.split('\n').length;
        let gutterText = '';
        for (let i = 1; i <= lines; i++) {
          gutterText += i + '\n';
        }
        gutter.textContent = gutterText;

        notifyCursorPosition();
      }

      function syncScroll() {
        document.getElementById('highlighting').scrollTop = editing.scrollTop;
        document.getElementById('highlighting').scrollLeft = editing.scrollLeft;
        gutter.scrollTop = editing.scrollTop;
      }

      function notifyCursorPosition() {
        if (!window.AndroidBridge) return;
        const text = editing.value.substring(0, editing.selectionStart);
        const lines = text.split('\n');
        const line = lines.length;
        const col = lines[lines.length - 1].length + 1;
        window.AndroidBridge.onCursorMoved(line, col);
      }

      function saveHistory(val) {
        if (historyIndex < historyStack.length - 1) {
          historyStack.splice(historyIndex + 1);
        }
        historyStack.push(val);
        if (historyStack.length > 50) historyStack.shift();
        historyIndex = historyStack.length - 1;
      }

      // Event Listeners
      editing.addEventListener('input', function() {
        updateEditor();
        syncScroll();
        saveHistory(editing.value);
        if (window.AndroidBridge && !isProgrammaticChange) {
          window.AndroidBridge.onContentChanged(editing.value);
        }
      });

      editing.addEventListener('scroll', syncScroll);
      editing.addEventListener('keyup', notifyCursorPosition);
      editing.addEventListener('click', notifyCursorPosition);

      // Public API invoked from Android Kotlin
      window.setEditorContent = function(content, lang) {
        isProgrammaticChange = true;
        currentLanguage = lang || currentLanguage;
        editing.value = content || '';
        historyStack.length = 0;
        saveHistory(editing.value);
        updateEditor();
        syncScroll();
        isProgrammaticChange = false;
      };

      window.getEditorContent = function() {
        return editing.value;
      };

      window.insertSymbol = function(symbol) {
        const start = editing.selectionStart;
        const end = editing.selectionEnd;
        const val = editing.value;

        if (symbol === 'Tab') {
          symbol = '  '; // 2 spasi
        }

        editing.value = val.substring(0, start) + symbol + val.substring(end);
        editing.selectionStart = editing.selectionEnd = start + symbol.length;
        editing.focus();
        updateEditor();
        syncScroll();
        saveHistory(editing.value);

        if (window.AndroidBridge) {
          window.AndroidBridge.onContentChanged(editing.value);
        }
      };

      window.undo = function() {
        if (historyIndex > 0) {
          historyIndex--;
          isProgrammaticChange = true;
          editing.value = historyStack[historyIndex];
          updateEditor();
          syncScroll();
          if (window.AndroidBridge) window.AndroidBridge.onContentChanged(editing.value);
          isProgrammaticChange = false;
        }
      };

      window.redo = function() {
        if (historyIndex < historyStack.length - 1) {
          historyIndex++;
          isProgrammaticChange = true;
          editing.value = historyStack[historyIndex];
          updateEditor();
          syncScroll();
          if (window.AndroidBridge) window.AndroidBridge.onContentChanged(editing.value);
          isProgrammaticChange = false;
        }
      };

      // Notify Android that editor is ready
      document.addEventListener('DOMContentLoaded', function() {
        saveHistory('');
        updateEditor();
        if (window.AndroidBridge) {
          window.AndroidBridge.onEditorReady();
        }
      });
    })();
  </script>
</body>
</html>
